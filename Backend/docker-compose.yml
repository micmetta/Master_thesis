version: '3.8'
services:
  app:
    container_name: container_text2sql
    image: text2sql/flask_app:1.0.0
    restart: always
    build: .
    ports:
      - "4000:4000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=bioInfoDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    depends_on:
      - db
      - experimental_db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - my_network

  db:
    image: postgres:latest
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_DB=bioInfoDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network


  experimental_db:
    image: postgres:latest
    restart: always
    container_name: experimental_db
    environment:
      - POSTGRES_DB=experimentalDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5433:5432"
    volumes:
      - experimental_data:/var/lib/postgresql/data
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
  experimental_data:
