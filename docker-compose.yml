version: '3.8'
services:
  db:
    image: postgres:latest
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_DB=bioInfoDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_scripts/bioInfoDB.sql:/docker-entrypoint-initdb.d/bioInfoDB.sql
    networks:
      - my_network

  experimentaldb:
    image: postgres:latest
    restart: always
    container_name: experimental_db
    environment:
      - POSTGRES_DB=experimentalDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5433:5432"
    volumes:
      - experimental_data:/var/lib/postgresql/data
      - ./db_scripts/experimentalDB.sql:/docker-entrypoint-initdb.d/experimentalDB.sql
    networks:
      - my_network

  nextjs-app:
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
      args:
        PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH}
        NEXT_PUBLIC_SSH_USER: ${NEXT_PUBLIC_SSH_USER}
        NEXT_PUBLIC_SSH_SERVER: ${NEXT_PUBLIC_SSH_SERVER}
        NEXT_PUBLIC_PATH_FILE_INFERENCES: ${NEXT_PUBLIC_PATH_FILE_INFERENCES}
    container_name: nextjs_app
    ports:
      - "3000:3000"
    networks:
      - my_network
    depends_on:
      - db
      - experimentaldb
    volumes:
      - "${PRIVATE_KEY_PATH}:/root/.ssh/id_rsa" # Monta la chiave privata SSH dal percorso specificato in PRIVATE_KEY_PATH (file ".env.local") nel container al percorso '/root/.ssh/id_rsa'.
                                                # Non si usa ':ro' per permettere la modifica dei permessi della chiave privata (richiesto per SSH).
    entrypoint: ["sh", "-c", "chmod 600 /root/.ssh/id_rsa && npm start"] # 'sh -c' per eseguire più comandi consecutivi nel container:
                                                                         # 1) 'chmod 600 /root/.ssh/id_rsa' imposta i permessi corretti sulla chiave privata montata,
                                                                         #     rendendola accessibile solo al proprietario, come richiesto per l'accesso SSH sicuro.
                                                                         # 2) 'npm start' avvia l'applicazione Next.js dopo che la chiave è pronta.

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
  experimental_data:
