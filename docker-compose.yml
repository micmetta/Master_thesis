services:
  db:
    image: postgres:latest
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_DB=bioInfoDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_scripts/bioInfoDB.sql:/docker-entrypoint-initdb.d/bioInfoDB.sql
    networks:
      - my_network

  experimentaldb:
    image: postgres:latest
    restart: always
    container_name: experimental_db
    environment:
      - POSTGRES_DB=experimentalDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5433:5432"
    volumes:
      - experimental_data:/var/lib/postgresql/data
      - ./db_scripts/experimentalDB.sql:/docker-entrypoint-initdb.d/experimentalDB.sql
    networks:
      - my_network

  nextjs-app:
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
      args:
        PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH}
        NEXT_PUBLIC_SSH_USER: ${NEXT_PUBLIC_SSH_USER}
        NEXT_PUBLIC_SSH_SERVER: ${NEXT_PUBLIC_SSH_SERVER}
        NEXT_PUBLIC_PATH_FILE_INFERENCES: ${NEXT_PUBLIC_PATH_FILE_INFERENCES}
    container_name: nextjs_app
    ports:
      - "3000:3000"
    networks:
      - my_network
    depends_on:
      - db
      - experimentaldb
    volumes:
      - "${PRIVATE_KEY_PATH}:/root/.ssh/id_rsa" # Mount the SSH private key from the path specified in PRIVATE_KEY_PATH (file ".env.local") in the container at '/root/.ssh/id_rsa'.
                                                # Do not use ':ro' to allow changing the private key permissions (required for SSH).
    entrypoint: ["sh", "-c", "chmod 600 /root/.ssh/id_rsa && npm start"] # 'sh -c' to run multiple consecutive commands in the container:
                                                                         #  1) 'chmod 600 /root/.ssh/id_rsa' sets the correct permissions on the mounted private key,
                                                                         #      making it accessible only to the owner, as required for secure SSH access.
                                                                         #  2) 'npm start' starts the Next.js application after the key is ready.

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
  experimental_data:
